name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.11.28
      - run: uv sync --frozen --all-groups --extra standalone
      - name: Require real GPG crypto checks on Linux
        if: runner.os == 'Linux'
        run: echo "REQUIRE_GPG_TESTS=1" >> "$GITHUB_ENV"
      - run: uv run --frozen --extra standalone python scripts/verify.py
      - run: uv run --frozen --extra standalone python scripts/verify_install.py
